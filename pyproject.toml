[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "alphamotion-locomotion-toolkit"
version = "0.2.0"
description = "AlphaMotion full-body conversion with fixed staged 100+100 refinement and offline evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
[project.optional-dependencies]
runtime = ["torch", "mujoco>=3.2", "opencv-python", "imageio-ffmpeg", "pandas", "pyarrow", "matplotlib", "Pillow"]
test = ["pytest"]
[tool.setuptools.packages.find]
where = ["src"]
